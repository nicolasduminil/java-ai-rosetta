quarkus.application.name=05-memory-persistent-langchain4j-quarkus

quarkus.langchain4j.ollama.base-url=${ollama.base-url:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${ollama.model:qwen2.5:0.5b}
quarkus.langchain4j.ollama.chat-model.temperature=0.0

# Qdrant host/port for the hand-rolled ChatMemoryStore. A plain (non-quarkus.*) namespace, so Quarkus
# does not flag it as an unrecognized extension key; overridden by the test resource.
chat-memory.qdrant.host=${qdrant.host:localhost}
chat-memory.qdrant.port=${qdrant.port:6334}

quarkus.devservices.enabled=false
