spring.application.name=05-memory-persistent-spring-ai-boot

spring.ai.ollama.chat.model=${ollama.model:qwen2.5:0.5b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.embedding.model=${ollama.embedding.model:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never

spring.ai.vectorstore.qdrant.host=${qdrant.host:localhost}
spring.ai.vectorstore.qdrant.port=${qdrant.port:6334}
spring.ai.vectorstore.qdrant.collection-name=chat-memory
spring.ai.vectorstore.qdrant.initialize-schema=true
