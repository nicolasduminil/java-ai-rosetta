quarkus.application.name=05-memory-inmemory-langchain4j-quarkus

quarkus.langchain4j.ollama.base-url=${ollama.base-url:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${ollama.model:qwen2.5:0.5b}
quarkus.langchain4j.ollama.chat-model.temperature=0.0

quarkus.langchain4j.chat-memory.type=MESSAGE_WINDOW
quarkus.langchain4j.chat-memory.memory-window.max-messages=20

quarkus.devservices.enabled=false
