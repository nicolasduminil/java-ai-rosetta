spring.application.name=02-templates-langchain4j-boot

langchain4j.ollama.chat-model.base-url=${ollama.base-url:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${ollama.model:qwen2.5:0.5b}
langchain4j.ollama.chat-model.temperature=0.0
# Structured output on a small model: advertise the JSON-schema capability so the AI service
# constrains the reply to the Answer record's shape (the starter has no responseFormat property).
langchain4j.ollama.chat-model.supported-capabilities=RESPONSE_FORMAT_JSON_SCHEMA
