spring.application.name=07-mcp-spring-ai-boot

spring.ai.ollama.chat.model=${ollama.model:qwen2.5:3b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.init.pull-model-strategy=never

spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.catalog.url=${mcp.server.url:http://localhost:8080}
