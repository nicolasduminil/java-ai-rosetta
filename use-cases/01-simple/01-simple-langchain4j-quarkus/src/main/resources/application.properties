quarkus.application.name=01-simple-langchain4j-quarkus

# Note the spelling differences from the other two tracks: base-url sits at the extension root
# rather than under chat-model, and the model is model-id rather than model-name (LangChain4j on
# Boot) or options.model (Spring AI). Same two settings, three names.
quarkus.langchain4j.ollama.base-url=${ollama.base-url:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${ollama.model:qwen2.5:0.5b}
quarkus.langchain4j.ollama.chat-model.temperature=0.0

# Quarkus would otherwise start its own Ollama Dev Service. The conformance suite supplies one
# container shared by all three stacks, which is what makes the comparison apples-to-apples.
quarkus.devservices.enabled=false
