spring.application.name=01-simple-langchain4j-boot

# base-url is NOT optional here. The starter guards its OllamaChatModel bean with
# @ConditionalOnProperty("langchain4j.ollama.chat-model.base-url"), so without this line there is
# no ChatModel, no service and no application context. Spring AI defaults it instead.
langchain4j.ollama.chat-model.base-url=${ollama.base-url:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${ollama.model:qwen2.5:0.5b}
langchain4j.ollama.chat-model.temperature=0.0
