spring.application.name=10-security-spring-ai-boot
server.port=8080

spring.ai.ollama.chat.model=${ollama.model:qwen2.5:3b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.embedding.model=${ollama.embedding.model:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never

spring.ai.vectorstore.qdrant.collection-name=security-spring-ai
spring.ai.vectorstore.qdrant.initialize-schema=true

# The JWT bearer tokens are verified with the RSA public key shipped in the common module. The private
# signing key lives only in the common module's test resources, so only the conformance test can mint tokens.
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/publicKey.pem
