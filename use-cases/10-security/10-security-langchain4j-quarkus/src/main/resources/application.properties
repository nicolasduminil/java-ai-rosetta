quarkus.application.name=10-security-langchain4j-quarkus
quarkus.http.port=8082

quarkus.langchain4j.ollama.base-url=${ollama.base-url:http://localhost:11434}
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.chat-model.model-id=${ollama.model:qwen2.5:3b}
quarkus.langchain4j.ollama.chat-model.temperature=0.0
quarkus.langchain4j.ollama.embedding-model.model-id=${ollama.embedding.model:nomic-embed-text}

quarkus.langchain4j.qdrant.host=${qdrant.host:localhost}
quarkus.langchain4j.qdrant.port=${qdrant.port:6334}
quarkus.langchain4j.qdrant.collection.name=security-langchain4j-quarkus

mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=https://rosetta.security.test

openai.api-key=${OPENAI_API_KEY:}

quarkus.devservices.enabled=false
