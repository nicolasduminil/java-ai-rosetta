quarkus.application.name=08-multimodal-langchain4j-quarkus
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-set}

# Required: the parent inherits quarkus-langchain4j-ollama, so two providers are on the classpath and the
# build fails ("multiple available providers") unless OpenAI is selected explicitly for each model type.
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.image-model.provider=openai
quarkus.langchain4j.audio-transcription-model.provider=openai

quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.0
quarkus.langchain4j.openai.audio-transcription-model.model-name=whisper-1
quarkus.langchain4j.openai.image-model.model-name=gpt-image-1-mini
quarkus.langchain4j.openai.image-model.size=1024x1024
quarkus.langchain4j.openai.image-model.quality=low

quarkus.langchain4j.openai.timeout=120s
quarkus.devservices.enabled=false
