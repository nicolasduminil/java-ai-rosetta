spring.application.name=08-multimodal-spring-ai-boot

spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}

spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.audio.transcription=openai
spring.ai.model.audio.speech=openai
spring.ai.model.image=openai

spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.0

spring.ai.openai.image.model=gpt-image-1-mini
spring.ai.openai.image.size=1024x1024
spring.ai.openai.image.quality=low

# Audio/image uploads.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
