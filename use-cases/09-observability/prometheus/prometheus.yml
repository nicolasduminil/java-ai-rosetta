global:
  scrape_interval: 15s

# The three applications run on the host. Boot exposes /actuator/prometheus, Quarkus exposes /q/metrics.
scrape_configs:
  - job_name: spring-ai
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: langchain4j-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: langchain4j-quarkus
    metrics_path: /q/metrics
    static_configs:
      - targets: ['host.docker.internal:8082']
