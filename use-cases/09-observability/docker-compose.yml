# Backing services plus the observability stack for use case 09.
#
# The three applications run from the host on fixed ports (see README):
#   spring-ai on 8080, langchain4j-boot on 8081, langchain4j-quarkus on 8082.
# Prometheus (in a container) scrapes them through host.docker.internal, and Grafana renders the gen_ai.*
# metrics they expose.
#
# Usage, if you already run Ollama natively on localhost:11434 (the apps' default):
#   docker compose up -d                                    # qdrant, prometheus, grafana (not ollama)
#   ollama pull qwen2.5:0.5b && ollama pull nomic-embed-text
# Usage, if you do NOT run Ollama locally (start it in Compose too):
#   docker compose --profile with-ollama up -d
#   docker compose exec ollama ollama pull qwen2.5:0.5b
#   docker compose exec ollama ollama pull nomic-embed-text
# then run the apps on their ports, make a few /ask calls, and open Grafana at http://localhost:3000
services:

  # Optional: only started with `--profile with-ollama`. If you already run Ollama natively on
  # localhost:11434 (which the apps default to), leave it out so `docker compose up` does not clash on 11434.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - obs
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST / dashboard
      - "6334:6334"   # gRPC (used by the applications)
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - obs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # let the container reach host-run apps on Linux
    networks:
      - obs
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - obs
    restart: unless-stopped

volumes:
  ollama-data:
  qdrant-data:

networks:
  obs:
    driver: bridge
