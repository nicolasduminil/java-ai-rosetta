spring.application.name=09-observability-spring-ai-boot

# Fixed run port so the three apps run side by side and Prometheus can scrape them (see prometheus.yml).
# Tests are unaffected: @SpringBootTest(RANDOM_PORT) picks its own port.
server.port=8080

spring.ai.ollama.chat.model=${ollama.model:qwen2.5:0.5b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.embedding.model=${ollama.embedding.model:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never

spring.ai.vectorstore.qdrant.collection-name=observability-spring-ai
spring.ai.vectorstore.qdrant.initialize-schema=true

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.access=read_only
