spring.application.name=09-observability-langchain4j-boot

# Fixed run port so the three apps run side by side and Prometheus can scrape them (see prometheus.yml).
# Tests are unaffected: @SpringBootTest(RANDOM_PORT) picks its own port.
server.port=8081

langchain4j.ollama.chat-model.base-url=${ollama.base-url:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${ollama.model:qwen2.5:0.5b}
langchain4j.ollama.chat-model.temperature=0.0
langchain4j.ollama.embedding-model.base-url=${ollama.base-url:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${ollama.embedding.model:nomic-embed-text}

langchain4j.qdrant.host=${qdrant.host:localhost}
langchain4j.qdrant.port=${qdrant.port:6334}
langchain4j.qdrant.collection-name=observability-langchain4j-boot

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.access=read_only
